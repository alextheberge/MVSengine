[package]
name = "mvs-core"
version = "2.5.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/alextheberge/MVSengine"
description = "Pure domain logic for MVS (ARCH.FEAT.PROT.FIX-CONT) multidimensional versioning: manifest schema, legacy-scheme translation, dependency-range resolution, host/extension compatibility. No network access or process spawning — safe to embed (WASM, Node, Python)."

[dependencies]
anyhow = "1.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
