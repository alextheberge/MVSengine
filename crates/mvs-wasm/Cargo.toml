[package]
name = "mvs-wasm"
version = "2.5.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/alextheberge/MVSengine"
description = "WASM bindings for mvs-core: convert a legacy version string (SemVer, PEP 440, CalVer, ...) to an MVS identity, for browser/Node embedding (e.g. an interactive migration playground)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mvs-core = { path = "../mvs-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
default = ["console_error_panic_hook"]
