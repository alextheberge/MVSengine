[package]
name = "mvs-crawler"
version = "2.5.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/alextheberge/MVSengine"
description = "Source crawler for MVS: extracts @mvs-feature/@mvs-protocol decorators and normalized public API signatures across 14 languages via tree-sitter and syn."

[dependencies]
anyhow = "1.0"
mvs-core = { path = "../mvs-core" }
quote = "1.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
toml = "=0.8.8"
tree-sitter = "0.24.7"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-language = "=0.1.3"
tree-sitter-lua = "0.2.0"
tree-sitter-luau = "1.2.0"
tree-sitter-php = "=0.23.11"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-swift = "=0.7.0"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"
