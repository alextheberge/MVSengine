[workspace]
members = ["crates/mvs-core", "crates/mvs-crawler", "crates/mvs-wasm"]
resolver = "2"

[package]
name = "mvs-manager"
version = "2.5.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/alextheberge/MVSengine"
readme = "README.md"
description = "MVS Engine manager CLI for multidimensional post-SemVer versioning."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
minisign = "0.9"
mvs-core = { path = "crates/mvs-core" }
mvs-crawler = { path = "crates/mvs-crawler" }
regex = "1.12"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = "2.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=0.8.8"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.1"
mockito = "1.7"
predicates = "3.1"
proptest = "1.6"

# Lets `cargo binstall mvs-manager` fetch the same checksum-verified release
# archives `scripts/install.sh`/`self-update` use, instead of compiling from
# source. Matches scripts/release/package.sh's
# `mvs-manager-<version>-<target>.<tar.gz|zip>` naming, binary at the
# archive root. Unverified against a real release until one is cut with
# this metadata present — check `cargo binstall --dry-run mvs-manager`
# after the first tag that includes it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
